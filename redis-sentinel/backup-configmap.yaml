apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-backup
  namespace: redis-sentinel
data:
  S3_BUCKET: redis-sentinel-backup 
  S3_PREFIX: redis-sentinel
  backup.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    : "${AWS_REGION:?AWS_REGION is required}"
    : "${S3_BUCKET:?S3_BUCKET is required}"
    : "${S3_PREFIX:?S3_PREFIX is required}"
    : "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    : "${REDIS_SENTINEL_HOST:?REDIS_SENTINEL_HOST is required}"
    : "${REDIS_SENTINEL_PORT:?REDIS_SENTINEL_PORT is required}"
    : "${REDIS_MASTER_NAME:?REDIS_MASTER_NAME is required}"

    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    work_dir="/backup/${timestamp}"
    destination="s3://${S3_BUCKET}/${S3_PREFIX%/}/${timestamp}"
    mkdir -p "$work_dir"
    export REDISCLI_AUTH="$REDIS_PASSWORD"

    mapfile -t master < <(
      redis-cli --tls --cacert /tls/ca.crt \
        --sni "$REDIS_SENTINEL_HOST" \
        -h "$REDIS_SENTINEL_HOST" -p "$REDIS_SENTINEL_PORT" --raw \
        SENTINEL get-master-addr-by-name "$REDIS_MASTER_NAME"
    )
    master_host="${master[0]:-}"
    master_port="${master[1]:-}"
    if [[ -z "$master_host" || ! "$master_port" =~ ^[0-9]+$ ]]; then
      echo "Sentinel did not return a valid primary address" >&2
      exit 1
    fi

    redis-cli --tls --cacert /tls/ca.crt --sni "$master_host" \
      -h "$master_host" -p "$master_port" --rdb "$work_dir/dump.rdb"
    redis-check-rdb "$work_dir/dump.rdb"

    cat > "$work_dir/metadata.json" <<EOF
    {"created_at":"${timestamp}","master_host":"${master_host}","master_port":${master_port},"redis_master_name":"${REDIS_MASTER_NAME}"}
    EOF
    (
      cd "$work_dir"
      sha256sum dump.rdb metadata.json > SHA256SUMS
    )

    aws s3 cp "$work_dir/" "$destination/" \
      --recursive --only-show-errors --sse AES256
    printf '%s\n' "$timestamp" > "$work_dir/_SUCCESS"
    aws s3 cp "$work_dir/_SUCCESS" "$destination/_SUCCESS" \
      --only-show-errors --sse AES256

    echo "Backup uploaded successfully: $destination/"
