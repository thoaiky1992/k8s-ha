apiVersion: batch/v1
kind: Job
metadata:
  name: redis-sentinel-backup-debug
  namespace: redis-sentinel
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: redis-sentinel-backup
      restartPolicy: Never

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: backup
          image: thoaiky1992/redis-sentinel-backup:1.0.0

          command:
            - /bin/bash
            - -x
            - /backup-script/backup.sh

          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: ap-southeast-1
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: redis-sentinel-backup
                  key: S3_BUCKET
            - name: S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: redis-sentinel-backup
                  key: S3_PREFIX
            - name: REDIS_SENTINEL_HOST
              value: redis-sentinel-sentinel.redis-sentinel.svc.cluster.local
            - name: REDIS_SENTINEL_PORT
              value: "26379"
            - name: REDIS_MASTER_NAME
              value: mymaster
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-sentinel-auth
                  key: redis-password

          volumeMounts:
            - name: backup-script
              mountPath: /backup-script
              readOnly: true
            - name: redis-tls
              mountPath: /tls
              readOnly: true
            - name: backup-work
              mountPath: /backup
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: backup-script
          configMap:
            name: redis-sentinel-backup
            defaultMode: 0555
        - name: redis-tls
          secret:
            secretName: redis-sentinel-tls
        - name: backup-work
          emptyDir:
            sizeLimit: 25Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi