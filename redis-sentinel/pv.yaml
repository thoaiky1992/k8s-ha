# PV được Amazon EBS CSI cấp động khi Pod sử dụng PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-sentinel-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
