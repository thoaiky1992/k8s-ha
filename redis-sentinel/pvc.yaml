# Chỉ áp dụng thủ công để thử EBS CSI. PVC dữ liệu thật do Helm chart tạo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-sentinel-storage-check
  namespace: redis-sentinel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: redis-sentinel-gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: redis-sentinel-storage-check
  namespace: redis-sentinel
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command: ["sh", "-c", "echo ok > /volume/check && sleep 3600"]
      volumeMounts:
        - name: volume
          mountPath: /volume
  volumes:
    - name: volume
      persistentVolumeClaim:
        claimName: redis-sentinel-storage-check
