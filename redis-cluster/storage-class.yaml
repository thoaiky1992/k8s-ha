# StorageClass cho PVC của RedisCluster. EBS CSI cấp PV động khi Pod sử dụng PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-cluster-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
