apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-demo-redis-cluster-backup
  namespace: redis-cluster
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dev-demo-redis-cluster-backup
  namespace: redis-cluster
spec:
  schedule: "30 1 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: dev-demo-redis-cluster-backup
        spec:
          serviceAccountName: dev-demo-redis-cluster-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Image gồm redis-cli, redis-check-rdb và AWS CLI. Build theo README, mục "Build image backup".
              image: thoaiky1992/redis-cluster-backup:1.0.0
              imagePullPolicy: IfNotPresent
              # /bin/sh trong image là dash, không hỗ trợ pipefail/mapfile của script.
              command: ["/bin/bash", "/backup-script/backup.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_REGION
                  value: ap-southeast-1
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: dev-demo-redis-cluster-backup
                      key: S3_BUCKET
                - name: S3_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: dev-demo-redis-cluster-backup
                      key: S3_PREFIX
                # Service của leader: CLUSTER NODES trả về toàn bộ topology từ bất kỳ node nào.
                - name: REDIS_CLUSTER_SEED_HOST
                  value: redis-cluster-leader.redis-cluster.svc.cluster.local
                - name: REDIS_PORT
                  value: "6379"
                - name: EXPECTED_SHARDS
                  value: "3"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-cluster-auth
                      key: redis-password
              volumeMounts:
                - name: backup-script
                  mountPath: /backup-script
                  readOnly: true
                - name: redis-tls
                  mountPath: /tls
                  readOnly: true
                - name: backup-work
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 25Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backup-script
              configMap:
                name: dev-demo-redis-cluster-backup
                defaultMode: 365 # 0555
            - name: redis-tls
              secret:
                secretName: redis-cluster-tls
                defaultMode: 288 # 0440
            - name: backup-work
              emptyDir:
                sizeLimit: 25Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
