# TCP 443 passes TLS through to the HTTPS listener managed by ECK on port 5601.
# apiVersion: v1
# kind: Service
# metadata:
#   name: kibana-public
#   namespace: kibana
#   annotations:
#     service.beta.kubernetes.io/aws-load-balancer-type: external
#     service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
#     service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
# spec:
#   type: LoadBalancer
#   loadBalancerSourceRanges:
#     - "42.115.87.250"   # IP của nhà phát triển
#   ports:
#     - name: https
#       protocol: TCP
#       port: 443
#       targetPort: 5601
#   selector:
#     kibana.k8s.elastic.co/name: kibana
# Supported annotations
# https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.7/guide/ingress/annotations/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: kibana
  annotations:
    # Get certificate-arn from ACM (AWS Certificate Manager), Output from terraform module: 01.kubernetes
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:945129430338:certificate/fe541066-8328-4052-8d0e-317b72b68208
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-path: /login
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: alb
  rules:
    - host: aws-kibana.thoaiky.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-kb-http
                port:
                  number: 5601



