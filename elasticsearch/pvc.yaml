# PVC thử nghiệm tùy chọn. Không áp dụng file này khi cài Elasticsearch.
# PVC dữ liệu thật do ECK tạo từ volumeClaimTemplates trong manifest.yaml.
# Với WaitForFirstConsumer, cần một Pod dùng PVC này trước khi PV được cấp.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-storage-check
  namespace: elasticsearch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: elasticsearch-gp3
  resources:
    requests:
      storage: 1Gi
---
# Chỉ dùng khi kiểm tra storage; xóa Pod và PVC sau khi đã ghi lại PV.
apiVersion: v1
kind: Pod
metadata:
  name: elasticsearch-storage-check
  namespace: elasticsearch
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command: ["sh", "-c", "echo ok > /volume/check && sleep 3600"]
      volumeMounts:
        - name: volume
          mountPath: /volume
  volumes:
    - name: volume
      persistentVolumeClaim:
        claimName: elasticsearch-storage-check
