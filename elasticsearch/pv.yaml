# EKS node group thông thường dùng Amazon EBS CSI Driver (không phải EKS Auto Mode).
# Driver tự tạo PV EBS khi PVC của Elasticsearch được một Pod sử dụng.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: elasticsearch-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
# Chọn AZ sau khi scheduler chọn node, vì một volume EBS chỉ gắn được trong một AZ.
volumeBindingMode: WaitForFirstConsumer
