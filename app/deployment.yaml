apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      nodeSelector:
        workload: node-api
      containers:
        - name: node-api
          # Build và push Dockerfile trong thư mục app, rồi thay image này.
          image: ghcr.io/your-org/node-api:1.0.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Bật (true) hoặc tắt (false) từng backend. Backend bị tắt không cần biến kết nối của nó.
            - name: ELASTICSEARCH_ENABLED
              value: "true"
            - name: REDIS_CLUSTER_ENABLED
              value: "true"
            - name: ELASTICSEARCH_URL
              value: https://search-es-http.elasticsearch.svc:9200
            - name: ELASTICSEARCH_CA_FILE
              value: /etc/backend-ca/elasticsearch-ca.crt
            # Một node bất kỳ của cluster; client đọc topology từ đây rồi định tuyến theo slot.
            - name: REDIS_CLUSTER_HOST
              value: redis-cluster-leader.redis-cluster.svc
            - name: REDIS_CLUSTER_PORT
              value: "6379"
            - name: REDIS_CLUSTER_CA_FILE
              value: /etc/backend-ca/redis-cluster-ca.crt
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: backend-credentials
          volumeMounts:
            - name: backend-ca
              mountPath: /etc/backend-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: backend-ca
          configMap:
            name: backend-ca
