# StorageClass cho PVC của broker/controller Kafka. EBS CSI cấp PV động khi Pod được lập lịch.
# Retain giữ EBS volume khi PVC bị xóa; mã hóa để dữ liệu log không nằm dạng thô trên EBS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
