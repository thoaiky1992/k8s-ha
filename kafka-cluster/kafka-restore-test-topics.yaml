# Chỉ dùng cho restore drill; không phải topic production.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order-service-v2-0-0
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: order-service.v2.0.0
  partitions: 12
  replicas: 3
  config:
    min.insync.replicas: "2"
    unclean.leader.election.enable: "false"
    cleanup.policy: delete
    retention.ms: "1209600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: pg-public-orders-v2-0-0
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: pg.public.orders.v2.0.0
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: "2"
    unclean.leader.election.enable: "false"
    cleanup.policy: delete
    retention.ms: "1209600000"
