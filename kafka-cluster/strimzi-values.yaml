# Strimzi cluster operator 1.3.0. Theo dõi namespace kafka (giống cách OT Redis Operator theo dõi redis-cluster).
# Chart tự thêm namespace kafka-system nơi operator chạy (STRIMZI_NAMESPACE="kafka,kafka-system"); không có Kafka CR nào ở đó.
watchNamespaces:
  - kafka
watchAnyNamespace: false

# Hai replica với leader election; anti-affinity theo hostname để hai Pod không cùng node.
replicas: 2

# Không đặt 2 Operator Pod trên cùng worker node.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            strimzi.io/kind: cluster-operator
        topologyKey: kubernetes.io/hostname

# Luôn giữ ít nhất 1 Operator Pod available
# khi thực hiện voluntary eviction.
podDisruptionBudget:
  enabled: true
  # Chart mặc định minAvailable=1; phải xóa khi dùng maxUnavailable vì Kubernetes
  # không cho phép đặt đồng thời cả hai trường.
  minAvailable: null
  maxUnavailable: 1

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 512Mi
