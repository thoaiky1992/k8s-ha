# Topic nội bộ của Kafka Connect (distributed mode). Nén theo key (compact) để giữ trạng thái mới nhất.
# Replication 3 và min.insync.replicas 2 khớp với cấu hình broker trong kafka.yaml.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: connect-configs
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  # Config topic phải có đúng một partition để thứ tự cập nhật config được bảo toàn.
  partitions: 1
  replicas: 3
  config:
    cleanup.policy: compact
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: connect-offsets
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 25
  replicas: 3
  config:
    cleanup.policy: compact
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: connect-status
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 5
  replicas: 3
  config:
    cleanup.policy: compact
    min.insync.replicas: "2"
