# Topic CDC của Debezium cho bảng public.orders.
# Khai báo tường minh vì Kafka cluster tắt auto.create.topics.enable.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: pg-public-orders-v1.0.0
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: pg.public.orders.v1.0.0
  # Một partition giữ nguyên thứ tự thay đổi của bảng trong WAL.
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    unclean.leader.election.enable: "false"
    cleanup.policy: delete
    retention.ms: "1209600000"
---
# Heartbeat topic của connector có topic.prefix=pg.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-heartbeat-pg
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: __debezium-heartbeat.pg
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: compact
