apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: redisinsight
  labels:
    app: redisinsight
spec:
  type: ClusterIP
  selector:
    app: redisinsight
  ports:
    - name: http
      port: 5540
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight
  namespace: redisinsight
  annotations:
    # Get certificate-arn from ACM (AWS Certificate Manager), Output from terraform module: 01.kubernetes
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:945129430338:certificate/342ab235-d91d-4a62-91a3-82c6f8f64e15
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Chỉ IP này được truy cập RedisInsight; RedisInsight chưa có xác thực riêng.
    alb.ingress.kubernetes.io/inbound-cidrs: 125.235.126.15/32
    alb.ingress.kubernetes.io/target-type: ip
    # RedisInsight phục vụ HTTP trên 5540 trong Pod; TLS kết thúc tại ALB.
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: alb
  rules:
    - host: aws-redisinsight.thoaiky.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redisinsight
                port:
                  number: 5540
