apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: redis-sentinel
  labels:
    app: redisinsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redisinsight
          image: redis/redisinsight:3.4.1
          imagePullPolicy: IfNotPresent
          env:
            # Đặt rõ hai biến này vì Service cũng có tên redisinsight.
            - name: RI_APP_HOST
              value: 0.0.0.0
            - name: RI_APP_PORT
              value: "5540"
            - name: RI_LOG_LEVEL
              value: info
            - name: RI_STDOUT_LOGGER
              value: "true"
            - name: RI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redisinsight
                  key: encryption-key
          ports:
            - name: http
              containerPort: 5540
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            # Chỉ project CA công khai; không mount tls.key vào RedisInsight.
            - name: redis-ca
              mountPath: /redis-tls
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redisinsight-data
        - name: redis-ca
          secret:
            secretName: redis-sentinel-tls
            defaultMode: 292 # 0444; chỉ project chứng chỉ CA công khai.
            items:
              - key: ca.crt
                path: ca.crt
